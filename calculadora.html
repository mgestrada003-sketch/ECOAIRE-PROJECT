<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EcoAire - Calculadora de Huella</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-success sticky-top">
        <div class="container">
            <a class="navbar-brand fw-bold" href="index.html">🌱 EcoAire App</a>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="index.html">Inicio</a></li>
                    <li class="nav-item"><a class="nav-link" href="mapa.html">Mapa</a></li>
                    <li class="nav-item"><a class="nav-link active" href="calculadora.html">Calculadora</a></li>
                    <li class="nav-item"><a class="nav-link" href="guia.html">Guía Verde</a></li>
                    <li class="nav-item"><a class="nav-link" href="contacto.html">Contacto</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <main class="container my-4">
        <h2>Calculadora de Huella de Carbono Personales</h2>
        <div class="card p-4 shadow-sm my-3">
            <div class="mb-3">
                <label class="form-label">Medio de transporte principal:</label>
                <select id="selectTransporte" class="form-select">
                    <option value="0.21">Automóvil Particular (Gasolina)</option>
                    <option value="0.08">Autobús Público</option>
                    <option value="0.03">Metro / Tren Eléctrico</option>
                    <option value="0">Bicicleta / Caminar</option>
                </select>
            </div>
            <div class="mb-3">
                <label class="form-label">Kilómetros recorridos diariamente:</label>
                <input type="number" id="inputKm" class="form-control" placeholder="Ej. 25">
            </div>
            <button class="btn btn-success w-100" onclick="calcularHuella()">Calcular Impacto</button>
        </div>

        <div class="mt-4">
            <h4>Tu resultado:</h4>
            <div class="progress my-2" style="height: 30px;">
                <div id="progressBar" class="progress-bar" role="progressbar" style="width: 0%;">0 Toneladas</div>
            </div>
            <p id="textoResultado" class="fw-bold text-muted">Ingresa tus datos para calcular.</p>
        </div>
    </main>

    <footer class="bg-dark text-white text-center py-3 mt-5">
        <p class="mb-0">© 2026 EcoAire - Datos provistos por WAQI API RESTful</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
